<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Butcherist Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #050507;
            --card-bg: rgba(25, 25, 35, 0.7);
            --accent-purple: #8a2be2;
            --neon-blue: #00d4ff;
            --text-main: #ffffff;
            --text-dim: #a0a0b0;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
            background: radial-gradient(circle at top right, #1a0b2e 0%, #050507 40%);
        }

        /* Top Banner Section */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 140px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            background: linear-gradient(90deg, rgba(138, 43, 226, 0.2), transparent);
        }

        .hero-banner img.bg {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            z-index: -1;
            mask-image: linear-gradient(to left, rgba(0,0,0,1), rgba(0,0,0,0));
            -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1), rgba(0,0,0,0));
        }

        .hero-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .main-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .hero-text h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
        .hero-text p { margin: 0; font-size: 13px; color: var(--text-dim); }

        /* Categories Grid - 2 columns like the screenshot */
        .categories-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .cat-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--glass-border);
            position: relative;
            backdrop-filter: blur(10px);
        }

        .cat-card img { width: 45px; height: 45px; border-radius: 10px; }
        .cat-card span { font-weight: 600; font-size: 15px; }
        .cat-card i.fa-chevron-right { 
            position: absolute; right: 15px; font-size: 12px; color: var(--accent-purple);
        }

        /* Product List */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 5px;
        }

        .section-header h2 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
        .section-header h2::before { content: ''; width: 4px; height: 18px; background: var(--accent-purple); border-radius: 2px; }
        .view-all { color: var(--accent-purple); font-size: 13px; font-weight: bold; }

        .product-item {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .prod-meta { display: flex; align-items: center; gap: 15px; }
        .prod-icon { width: 45px; height: 45px; border-radius: 12px; }
        
        .prod-name { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
        .prod-price { color: var(--accent-purple); font-weight: 800; font-size: 17px; }

        .buy-button {
            background: linear-gradient(45deg, #7022c4, #8a2be2);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 15, 0.95);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            z-index: 100;
        }

        .nav-link { 
            display: flex; flex-direction: column; align-items: center; 
            color: var(--text-dim); text-decoration: none; font-size: 11px; gap: 5px;
        }
        .nav-link.active { color: var(--accent-purple); }
        .nav-link i { font-size: 20px; }

    </style>
</head>
<body>

    <!-- Hero Section -->
    <div class="hero-banner">
        <!-- جایگزین کردن عکس کاراکتر بنفش -->
        <img src="Banner.jpg" class="bg" onerror="this.style.display='none'">
        <div class="hero-content">
            <img src="LoGo G2G Finally.png" class="main-logo">
            <div class="hero-text">
                <h1>Butcherist</h1>
                <p>Game Booster & Digital Store</p>
            </div>
        </div>
    </div>

    <!-- Categories Grid -->
    <div class="categories-grid">
        <div class="cat-card">
            <img src="GearUpBoosterIcon.jpg">
            <span>GearUP Booster</span>
            <i class="fas fa-chevron-right"></i>
        </div>
        <div class="cat-card">
            <img src="SteamIcon.jpg">
            <span>Steam</span>
            <i class="fas fa-chevron-right"></i>
        </div>
        <div class="cat-card">
            <img src="ExitlagIcon.jpg">
            <span>ExitLag</span>
            <i class="fas fa-chevron-right"></i>
        </div>
        <div class="cat-card">
            <img src="SpotifyIcon.jpg">
            <span>Spotify</span>
            <i class="fas fa-chevron-right"></i>
        </div>
    </div>

    <!-- Product List -->
    <div class="section-header">
        <h2>GearUP Booster</h2>
        <span class="view-all">View All <i class="fas fa-chevron-right"></i></span>
    </div>

    <div id="product-container">
        <!-- لیست ۵ محصول GearUP -->
        <div class="product-item">
            <div class="prod-meta">
                <img src="GearUpBoosterIcon.jpg" class="prod-icon">
                <div>
                    <div class="prod-name">GearUP PC Global 1M</div>
                    <div class="prod-price">$4.00</div>
                </div>
            </div>
            <button class="buy-button" onclick="sendOrder('pc_1m', 4.00)"><i class="fas fa-shopping-cart"></i> Buy</button>
        </div>

        <div class="product-item">
            <div class="prod-meta">
                <img src="GearUpBoosterIcon.jpg" class="prod-icon">
                <div>
                    <div class="prod-name">GearUP PC Global 3M</div>
                    <div class="prod-price">$11.50</div>
                </div>
            </div>
            <button class="buy-button" onclick="sendOrder('pc_3m', 11.50)"><i class="fas fa-shopping-cart"></i> Buy</button>
        </div>

        <div class="product-item">
            <div class="prod-meta">
                <img src="GearUpBoosterIcon.jpg" class="prod-icon">
                <div>
                    <div class="prod-name">GearUP PC Global 12M</div>
                    <div class="prod-price">$36.00</div>
                </div>
            </div>
            <button class="buy-button" onclick="sendOrder('pc_12m', 36.00)"><i class="fas fa-shopping-cart"></i> Buy</button>
        </div>

        <div class="product-item">
            <div class="prod-meta">
                <img src="GearUpBoosterIcon.jpg" class="prod-icon">
                <div>
                    <div class="prod-name">GearUP Mobile Global 1M</div>
                    <div class="prod-price">$4.80</div>
                </div>
            </div>
            <button class="buy-button" onclick="sendOrder('mob_gl_1m', 4.80)"><i class="fas fa-shopping-cart"></i> Buy</button>
        </div>

        <div class="product-item">
            <div class="prod-meta">
                <img src="GearUpBoosterIcon.jpg" class="prod-icon">
                <div>
                    <div class="prod-name">GearUP Mobile Iran 1M</div>
                    <div class="prod-price">$1.70</div>
                </div>
            </div>
            <button class="buy-button" onclick="sendOrder('mob_ir_1m', 1.70)"><i class="fas fa-shopping-cart"></i> Buy</button>
        </div>
    </div>

    <div style="height: 80px;"></div>

    <!-- Navigation -->
    <div class="bottom-nav">
        <a href="#" class="nav-link active"><i class="fas fa-home"></i>Home</a>
        <a href="#" class="nav-link"><i class="fas fa-th-large"></i>Orders</a>
        <a href="#" class="nav-link"><i class="fas fa-headset"></i>Support</a>
        <a href="#" class="nav-link"><i class="fas fa-user"></i>Profile</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#050507';

        function sendOrder(id, price) {
            const data = {
                action: 'buy',
                product_id: id,
                amount: price
            };
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
