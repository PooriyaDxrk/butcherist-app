<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Butcherist Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f0f12;
      --secondary-bg: #18181c;
      --text-color: #ffffff;
      --hint-color: #a1a1aa;
      --accent-color: #7c3aed;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 16px; padding-bottom: 100px; line-height: 1.5; }

    /* Header */
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--card-border); }
    .brand-logo { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; }
    .brand-title { font-size: 1.2rem; font-weight: bold; }
    .brand-subtitle { font-size: 0.75rem; color: var(--hint-color); }

    /* Categories Horizontal Scroll or Grid */
    .section-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 12px; color: var(--hint-color); display: block; }
    .categories-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
    
    .category-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .category-card.active { border-color: var(--accent-color); background: rgba(124, 58, 237, 0.15); }
    .category-icon { width: 32px; height: 32px; margin-bottom: 8px; border-radius: 6px; object-fit: contain; }
    .category-name { font-size: 0.7rem; font-weight: 600; text-align: center; }

    /* Product List */
    .products-container { display: flex; flex-direction: column; gap: 10px; }
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .product-card:active { background: rgba(255, 255, 255, 0.08); }
    .product-info { display: flex; align-items: center; gap: 12px; }
    .product-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
    .product-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 2px; }
    .product-desc { font-size: 0.7rem; color: var(--hint-color); }
    .product-price { font-size: 0.9rem; font-weight: 700; color: #10b981; }
    .price-tag { background: rgba(16, 185, 129, 0.1); padding: 4px 8px; border-radius: 6px; }
    .no-price { color: var(--hint-color); font-size: 0.7rem; }

    /* Bottom Bar */
    .footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--secondary-bg); padding: 15px; border-top: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
    .btn-buy { background: var(--accent-color); color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    .selected-info { display: flex; flex-direction: column; }
    .selected-label { font-size: 0.7rem; color: var(--hint-color); }
    .selected-name { font-size: 0.9rem; font-weight: bold; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>

  <div class="header">
    <img src="LoGo G2G Finally.png" class="brand-logo" alt="Logo">
    <div>
      <div class="brand-title">Butcherist</div>
      <div class="brand-subtitle">مرجع اشتراک‌های گیمینگ و کدهای دیجیتال</div>
    </div>
  </div>

  <span class="section-title">انتخاب دسته‌بندی</span>
  <div class="categories-grid">
    <div class="category-card active" onclick="selectCategory('gearup', this)">
      <img src="GearUpBoosterIcon.jpg" class="category-icon">
      <div class="category-name">GearUP</div>
    </div>
    <div class="category-card" onclick="selectCategory('steam', this)">
      <img src="SteamIcon.jpg" class="category-icon">
      <div class="category-name">Steam</div>
    </div>
    <div class="category-card" onclick="selectCategory('exitlag', this)">
      <img src="ExitlagIcon.jpg" class="category-icon">
      <div class="category-name">ExitLag</div>
    </div>
    <div class="category-card" onclick="selectCategory('spotify', this)">
      <img src="SpotifyIcon.jpg" class="category-icon">
      <div class="category-name">Spotify</div>
    </div>
    <div class="category-card" onclick="selectCategory('youtube', this)">
      <img src="YoutubeIcon.jpg" class="category-icon">
      <div class="category-name">YouTube</div>
    </div>
  </div>

  <span class="section-title" id="cat-title">محصولات GearUP</span>
  <div class="products-container" id="product-list">
    <!-- محصولات اینجا نمایش داده می‌شوند -->
  </div>

  <div class="footer">
    <div class="selected-info">
      <span class="selected-label">آیتم انتخابی:</span>
      <span class="selected-name" id="selected-name">چیزی انتخاب نشده</span>
    </div>
    <button class="btn-buy" onclick="sendOrder()">ثبت سفارش</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const data = {
      gearup: [
        { id: 'g1', title: 'GearUP PC 1 Month', desc: 'اشتراک یک ماهه', price: 3.47, img: 'GearUpBoosterIcon.jpg' },
        { id: 'g3', title: 'GearUP PC 3 Months', desc: 'اشتراک سه ماهه', price: 9.99, img: 'GearUpBoosterIcon.jpg' },
        { id: 'g12', title: 'GearUP PC 12 Months', desc: 'اشتراک یک ساله', price: 29.99, img: 'GearUpBoosterIcon.jpg' }
      ],
      steam: [
        { id: 's5', title: 'Steam $5', desc: 'گیفت کارت استیم', price: null, img: 'SteamIcon.jpg' },
        { id: 's10', title: 'Steam $10', desc: 'گیفت کارت استیم', price: null, img: 'SteamIcon.jpg' }
      ],
      exitlag: [
        { id: 'ex1', title: 'ExitLag 1 Month', desc: 'کاهش پینگ حرفه‌ای', price: null, img: 'ExitlagIcon.jpg' }
      ],
      spotify: [
        { id: 'sp1', title: 'Spotify Premium', desc: 'اشتراک شخصی', price: null, img: 'SpotifyIcon.jpg' }
      ],
      youtube: [
        { id: 'yt1', title: 'YouTube Premium', desc: 'بدون تبلیغات', price: null, img: 'YoutubeIcon.jpg' }
      ]
    };

    let selectedItem = null;

    function selectCategory(cat, el) {
      document.querySelectorAll('.category-card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('cat-title').innerText = 'محصولات ' + el.querySelector('.category-name').innerText;
      render(cat);
    }

    function render(cat) {
      const container = document.getElementById('product-list');
      container.innerHTML = '';
      data[cat].forEach(item => {
        const div = document.createElement('div');
        div.className = 'product-card';
        div.onclick = () => {
          if(item.price === null) {
            tg.showAlert('قیمت این محصول هنوز وارد نشده است.');
            return;
          }
          selectedItem = item;
          document.getElementById('selected-name').innerText = item.title;
        };
        
        const priceHTML = item.price 
          ? `<div class="price-tag"><span class="product-price">$${item.price}</span></div>` 
          : `<span class="no-price">استعلام قیمت</span>`;

        div.innerHTML = `
          <div class="product-info">
            <img src="${item.img}" class="product-thumb">
            <div>
              <div class="product-title">${item.title}</div>
              <div class="product-desc">${item.desc}</div>
            </div>
          </div>
          ${priceHTML}
        `;
        container.appendChild(div);
      });
    }

    function sendOrder() {
      if(!selectedItem) {
        tg.showAlert('لطفاً ابتدا یک محصول را انتخاب کنید.');
        return;
      }
      tg.sendData(JSON.stringify(selectedItem));
    }

    // لود اولیه
    render('gearup');
  </script>
</body>
</html>
