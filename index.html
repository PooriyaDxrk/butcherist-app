<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Butcherist Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #07060b;
            --card-bg: rgba(22, 19, 35, 0.75);
            --accent-purple: #8b5cf6;
            --text-main: #ffffff;
            --text-dim: #9ca3af;
            --glass-border: rgba(139, 92, 246, 0.18);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 16px; padding-bottom: 90px; background-attachment: fixed; }
        .hero-banner { position: relative; width: 100%; height: 120px; border-radius: 20px; margin-bottom: 22px; border: 1px solid rgba(139, 92, 246, 0.3); display: flex; align-items: center; padding: 0 20px; background: linear-gradient(135deg, rgba(30, 20, 50, 0.9) 0%, rgba(15, 10, 25, 0.95) 100%); }
        .hero-content { display: flex; align-items: center; gap: 16px; }
        .main-logo { width: 54px; height: 54px; border-radius: 14px; object-fit: cover; }
        .hero-text h1 { margin: 0; font-size: 22px; font-weight: 700; background: linear-gradient(to right, #ffffff, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-text p { margin: 3px 0 0 0; font-size: 12px; color: var(--text-dim); }
        .categories-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .cat-card { background: var(--card-bg); border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--glass-border); cursor: pointer; }
        .cat-card img { width: 42px; height: 42px; border-radius: 12px; object-fit: cover; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding: 0 4px; }
        .section-header h2 { font-size: 17px; margin: 0; display: flex; align-items: center; gap: 10px; }
        .product-item { background: var(--card-bg); border-radius: 18px; padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--glass-border); }
        .prod-meta { display: flex; align-items: center; gap: 14px; }
        .prod-icon { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; }
        .prod-price { color: #c084fc; font-weight: 700; font-size: 16px; }
        .buy-button { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); color: white; border: none; padding: 9px 18px; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10, 8, 16, 0.92); display: flex; justify-content: space-around; padding: 10px 0 14px 0; border-top: 1px solid rgba(255, 255, 255, 0.08); z-index: 100; }
        .nav-link { display: flex; flex-direction: column; align-items: center; color: var(--text-dim); text-decoration: none; font-size: 11px; gap: 4px; cursor: pointer; }
        .nav-link.active { color: #c084fc; }
    </style>
</head>
<body>
    <div class="hero-banner">
        <div class="hero-content">
            <img src="LoGo G2G Finally.png" class="main-logo" onerror="this.src='https://via.placeholder.com/54/8b5cf6/ffffff?text=B'">
            <div class="hero-text">
                <h1>Butcherist</h1>
                <p>Game Booster & Digital Store</p>
            </div>
        </div>
    </div>
    <div class="categories-grid">
        <div class="cat-card"><span>GearUP Booster</span></div>
        <div class="cat-card"><span>Steam</span></div>
    </div>
    <div id="product-container">
        <div class="product-item">
            <div class="prod-meta">
                <div><div class="prod-name">GearUP Global 1M</div><div class="prod-price">$4.00</div></div>
            </div>
            <button class="buy-button" onclick="sendOrder('pc_1m', 4.00)">Buy</button>
        </div>
    </div>
    <div class="bottom-nav">
        <a href="#" class="nav-link active" onclick="navigate(event, 'home')"><i class="fas fa-house"></i>Home</a>
        <a href="#" class="nav-link" onclick="openSupportLink()"><i class="fas fa-headset"></i>Support</a>
    </div>
    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
        const PROFILE_API_BASE = ''; // اینجا آدرس بک‌اند HTTPS خود را وارد کنید
        function openSupportLink() { tg.openTelegramLink('https://t.me/Pooriya_Tgh'); }
        function sendOrder(productId, price) {
            if (tg?.sendData) tg.sendData(JSON.stringify({action: 'buy', product_id: productId, price: price}));
            else alert('سفارش ثبت شد: ' + productId);
        }
    </script>
</body>
</html>
